<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1473e6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' app:; script-src 'self' app: 'wasm-unsafe-eval'; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob:; font-src 'self' app: data: blob:; worker-src 'self' app: blob:; connect-src 'self' app: data: blob: ws:"
    />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>BookReader</title>
    <style>
      /* Startup splash; replaced when React renders into #root. */
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f7f8fa;
        font:
          600 15px -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #1d1d1f;
      }
      .splash div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        animation: splash-in 0.4s ease-out;
      }
      .splash img {
        width: 96px;
        height: 96px;
      }
      @media (prefers-color-scheme: dark) {
        .splash {
          background: #1b1b1d;
          color: #ececee;
        }
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div><img src="icons/icon.svg" alt="" />BookReader</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
