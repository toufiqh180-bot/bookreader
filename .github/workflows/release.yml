# Builds installers for macOS, Windows and Linux when a version tag is pushed
# (e.g. `git tag v0.1.0 && git push --tags`) and attaches them to a draft
# GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds; add signing secrets here when available.
          CSC_IDENTITY_AUTO_DISCOVERY: false
