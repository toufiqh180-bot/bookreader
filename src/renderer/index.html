<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' app:; script-src 'self' app:; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob:; font-src 'self' app: data: blob:; worker-src 'self' app: blob:; connect-src 'self' app: data: blob:"
    />
    <title>BookReader</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/chrome.css" />
    <link rel="stylesheet" href="styles/reader.css" />
    <link rel="stylesheet" href="styles/sidebar.css" />
    <link rel="stylesheet" href="styles/overlays.css" />
    <link rel="stylesheet" href="styles/library.css" />
    <script type="module" src="index.js"></script>
  </head>
  <body data-chrome="light">
    <header id="tabbar" class="tabbar"></header>
    <nav id="toolbar" class="toolbar" aria-label="Reader toolbar"></nav>
    <main class="main">
      <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
      <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical"></div>
      <section id="workspace" class="workspace">
        <div id="library" class="library-host"></div>
      </section>
    </main>
    <footer id="statusbar" class="statusbar"></footer>
    <div class="drop-overlay" aria-hidden="true"><div>Drop PDF to open</div></div>
  </body>
</html>
