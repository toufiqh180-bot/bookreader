[package]
name = "bookreader"
version = "0.1.0"
description = "A free, open-source PDF reader made for reading books."
authors = ["BookReader contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bookreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
